name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the most recent draft)"
        required: false
        type: string

# The called workflow prefers the ESPHome GitHub App token (via
# vars.ESPHOME_GITHUB_APP_CLIENT_ID and the inherited
# ESPHOME_GITHUB_APP_PRIVATE_KEY secret) so that publishing fires a
# `release: published` event downstream, and falls back to GITHUB_TOKEN when
# the App is not configured. It runs in this repo's `release` environment.
#
# contents: write is required at the caller because the called workflow
# declares it for the GITHUB_TOKEN fallback path; a reusable workflow cannot
# be granted more than the caller holds, so permissions: {} here fails the
# run at startup.
permissions:
  contents: write

jobs:
  release:
    name: Publish draft release
    # Patches the draft release's manifest assets with the final release
    # notes, then publishes it — all by release id, immune to the
    # draft-by-tag lookup and draft-untagging API pitfalls.
    uses: esphome/workflows/.github/workflows/publish-draft-release.yml@31d160e5f0ffa0ee65d5b27cb55c153d415f2abe  # 2026.10.2
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
