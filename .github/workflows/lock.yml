name: Lock

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  lock:
    uses: esphome/workflows/.github/workflows/lock.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6  # 2026.8.1
    with:
      pr-close-days: 1
      issue-close-days: 1
      exclude-label: keep-open
