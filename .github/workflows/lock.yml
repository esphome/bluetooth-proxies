name: Lock

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  lock:
    uses: esphome/workflows/.github/workflows/lock.yml@57a5927f9cdc5da7c40c702403eabeff6ab9856a  # 2026.8.0
    with:
      pr-close-days: 1
      issue-close-days: 1
      exclude-label: keep-open
