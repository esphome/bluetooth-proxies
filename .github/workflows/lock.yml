name: Lock

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  lock:
    uses: esphome/workflows/.github/workflows/lock.yml@b2c0cffae477d81175c67e6a44651a9bc2b49f6f  # 2026.11.0
    with:
      pr-close-days: 1
      issue-close-days: 1
      exclude-label: keep-open
