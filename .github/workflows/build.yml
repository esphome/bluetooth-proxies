name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

# The called workflow's draft-release jobs (read draft info, replace assets,
# strip the pending warning) need contents: write; they only run on
# workflow_run events. Fork pull requests still get a read-only token.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release-drafter' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build to Draft Release
    # Builds every factory config and, when triggered by a successful Release
    # Drafter run, uploads the firmware to the current draft release. The
    # esp32-generic variants are combined into one manifest (their
    # update.source URLs all point at the single esp32-generic manifest); the
    # remaining devices each publish their own manifest via the empty-named
    # group. `groups` requires files to be listed explicitly — it is not
    # auto-discovered, since discovery would sweep every config into one group.
    uses: esphome/workflows/.github/workflows/build-to-draft-release.yml@57a5927f9cdc5da7c40c702403eabeff6ab9856a  # 2026.8.0
    with:
      esphome-version: 2026.7.1
      groups: |
        [
          {
            "name": "esp32-generic",
            "files": [
              "esp32-generic/esp32-generic.factory.yaml",
              "esp32-generic/esp32-generic-c3.factory.yaml",
              "esp32-generic/esp32-generic-c6.factory.yaml",
              "esp32-generic/esp32-generic-s3.factory.yaml"
            ]
          },
          {
            "name": "",
            "files": [
              "gl-inet/gl-s10.factory.yaml",
              "lilygo/lilygo-t-eth-poe.factory.yaml",
              "m5stack/m5stack-atom-lite.factory.yaml",
              "m5stack/m5stack-atom-s3.factory.yaml",
              "olimex/olimex-esp32-poe-iso.factory.yaml",
              "seeed/seeed-esp32-poe.factory.yaml",
              "wt32/wt32-eth01.factory.yaml"
            ]
          }
        ]
